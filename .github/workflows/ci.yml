name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all Python tool suites
        run: python test_all.py

  bookbarcode-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Test supported Python baseline
        run: python -m unittest discover -s file-tools/isbn_barcode/tests
      - name: Build package artifacts
        run: |
          python -m pip install build
          python -m build file-tools/isbn_barcode
