name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked --extra book-editing
      - name: Run Python and registry checks
        run: uv run --locked --extra book-editing python check.py

  bookbarcode-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Test supported Python baseline
        run: python -m unittest discover -s file-tools/isbn_barcode/tests
      - name: Build package artifacts
        run: |
          python -m pip install build
          python -m build file-tools/isbn_barcode

  graph-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-tools/semantic_graph_viewer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: visual-tools/semantic_graph_viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
