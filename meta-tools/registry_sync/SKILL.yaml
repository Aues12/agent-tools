name: registry_sync
type: tool
capability: registry_consistency
purpose: Compare local tool metadata with the registry and apply a reviewed update.
status: experimental
interfaces:
  - name: stdin_json
    entrypoint: tool.py
    transport: stdin_json
  - name: python_api
    entrypoint: tool.py
    callables:
      - plan
      - sync
      - run
operations:
  - name: check
    available_via: [stdin_json, python_api]
    params:
      root: {type: string, required: false}
    returns: {type: object, description: Registry differences and unrepresented entries.}
  - name: plan
    available_via: [stdin_json, python_api]
    params:
      root: {type: string, required: false}
    returns: {type: object, description: Proposed changes and plan digest.}
  - name: apply
    available_via: [stdin_json, python_api]
    params:
      root: {type: string, required: false}
      expected_plan_sha256: {type: string, required: true}
    returns: {type: object, description: Applied changes and remaining warnings.}
side_effects:
  reads: [local SKILL.yaml files, registry/tool_registry.json]
  writes: [registry/tool_registry.json only on apply]
dependencies:
  optional_extra: meta-tools
validation:
  - python3 -m unittest discover -s meta-tools/registry_sync/tests
