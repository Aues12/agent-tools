name: repo_sync
type: tool
capability: repository_file_sync
purpose: Plan and apply a reviewed one-way copy of explicitly selected shared files.
status: experimental
interfaces:
  - name: stdin_json
    entrypoint: tool.py
    transport: stdin_json
  - name: python_api
    entrypoint: tool.py
    callables: [plan, sync, run]
operations:
  - name: check
    available_via: [stdin_json, python_api]
    params:
      source_root: {type: string, required: true}
      target_root: {type: string, required: true}
      manifest_path: {type: string, required: true}
    returns: {type: object, description: Differences and target-only files; no writes.}
  - name: plan
    available_via: [stdin_json, python_api]
    params:
      source_root: {type: string, required: true}
      target_root: {type: string, required: true}
      manifest_path: {type: string, required: true}
    returns: {type: object, description: Proposed copies and a plan digest.}
  - name: apply
    available_via: [stdin_json, python_api]
    params:
      source_root: {type: string, required: true}
      target_root: {type: string, required: true}
      manifest_path: {type: string, required: true}
      expected_plan_sha256: {type: string, required: true}
    returns: {type: object, description: Applied copies and remaining target-only files.}
side_effects:
  reads: [manifest, selected source files, selected target files]
  writes: [selected target files only on apply]
validation:
  - python3 -m unittest discover -s meta-tools/repo_sync/tests
