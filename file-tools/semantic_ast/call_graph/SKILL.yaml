name: call_graph
type: tool
capability: semantic_code_analysis
purpose: Extract deterministic local function call relationships from semantic AST trees.
search_terms:
  - Python function calls
  - code invocation relations
  - Python fonksiyon çağrı ilişkileri
status: experimental
deterministic: true
interfaces:
  - name: parent_stdin_json
    entrypoint: ../semantic_ast.py
    transport: stdin_json
    operations:
      - build_call_graph
      - parse_and_build_call_graph
  - name: python_api
    entrypoint: call_graph.py
    callables:
      - build_call_graph
      - render_call_tree
operations:
  - name: build_call_graph
    available_via:
      - parent_stdin_json
      - python_api
    params:
      tree:
        type: object
        required: true
    returns:
      type: object
      description: Graph nodes, edges, roots, leaves, and readable call tree.
  - name: parse_and_build_call_graph
    available_via:
      - parent_stdin_json
    params:
      source:
        type: string
        required: false
      path:
        type: string
        required: false
      encoding:
        type: string
        required: false
        default: utf-8
      include_source:
        type: boolean
        required: false
        default: false
    requires_one_of:
      - source
      - path
    returns:
      type: object
      description: Parsed semantic AST call graph.
side_effects:
  reads:
    - build_call_graph reads provided semantic AST data only.
    - parse_and_build_call_graph reads a file only when path is provided instead of source.
  writes: []
line_numbers:
  base: 1
  ranges: inclusive
limits:
  - local static call extraction only; dynamic dispatch is intentionally out of scope.
failure_modes:
  - invalid tree shapes may produce empty graph output or structured parent errors.
validation:
  - python3 -m unittest discover -s file-tools/semantic_ast/call_graph/tests
