name: semantic_cfg
type: tool
capability: semantic_code_analysis
purpose: Build deterministic local Python control-flow graphs from semantic AST structures.
status: experimental
deterministic: true
interfaces:
  - name: stdin_json
    entrypoint: semantic_cfg.py
    transport: stdin_json
  - name: python_api
    entrypoint: tool.py
    callables:
      - build_cfg
      - build_cfg_from_source
      - build_cfg_from_file
      - cfg_from_source
      - cfg_from_file
      - summarize_cfg
      - run
operations:
  - name: build_cfg
    available_via:
      - stdin_json
      - python_api
    params:
      tree:
        type: object
        required: true
    returns:
      type: object
      description: Function-level control-flow graph result.
  - name: build_cfg_from_source
    available_via:
      - stdin_json
      - python_api
    params:
      source:
        type: string
        required: true
      path:
        type: string
        required: false
    returns:
      type: object
      description: Parsed Python source control-flow graph.
  - name: build_cfg_from_file
    available_via:
      - stdin_json
      - python_api
    params:
      path:
        type: string
        required: true
      encoding:
        type: string
        required: false
        default: utf-8
    returns:
      type: object
      description: Parsed Python file control-flow graph.
  - name: summarize_cfg
    available_via:
      - stdin_json
      - python_api
    params:
      cfg:
        type: object
        required: true
    returns:
      type: object
      description: Compact human-readable control-flow summaries.
side_effects:
  reads:
    - build_cfg reads provided semantic AST data only.
    - build_cfg_from_source reads provided source text only.
    - build_cfg_from_file reads the provided file path.
    - summarize_cfg reads provided CFG data only.
  writes: []
line_numbers:
  base: 1
  ranges: inclusive
limits:
  - v1 is local to Python function scopes.
  - v1 does not perform type inference, interprocedural analysis, SSA, runtime tracing, symbolic execution, or path feasibility proofs.
  - try/except/finally and async_for are partial models and emit warnings where semantics are intentionally simplified.
failure_modes:
  - non-module trees return a structured ValueError envelope.
  - invalid source raises SyntaxError or IndentationError in the structured error envelope.
  - missing files raise FileNotFoundError.
validation:
  - python3 -m unittest discover -s file-tools/semantic_cfg/tests
