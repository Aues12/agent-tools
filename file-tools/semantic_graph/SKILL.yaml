name: semantic_graph
version: 0.1.0
type: tool
capability: semantic_graph_construction
purpose: Build a general graph incrementally in a persistent terminal session.
status: experimental
interfaces:
  - name: terminal_session
    entrypoint: semantic_graph.py session
    transport: line_commands
  - name: stdin_json
    entrypoint: semantic_graph.py
    transport: stdin_json
  - name: python_api
    entrypoint: tool.py
    callables:
      - create_graph
      - add_node
      - add_edge
      - run
operations:
  - name: create_graph
    available_via:
      - terminal_session
      - stdin_json
      - python_api
    params:
      graph_id:
        type: string
        required: true
      title:
        type: string
        required: false
      attributes:
        type: object
        required: false
    returns:
      type: object
      description: Empty serialized general graph.
  - name: add_node
    available_via:
      - terminal_session
      - stdin_json
      - python_api
    params:
      graph:
        type: object
        required: true
        note: Supplied by the active graph in terminal sessions.
      label:
        type: string
        required: true
      kind:
        type: string
        required: false
        default: node
      attributes:
        type: object
        required: false
    returns:
      type: object
      description: Updated graph and created node.
  - name: add_edge
    available_via:
      - terminal_session
      - stdin_json
      - python_api
    params:
      graph:
        type: object
        required: true
        note: Supplied by the active graph in terminal sessions.
      source:
        type: integer
        required: true
      target:
        type: integer
        required: true
      kind:
        type: string
        required: false
        default: edge
      label:
        type: string
        required: false
      attributes:
        type: object
        required: false
    returns:
      type: object
      description: Updated graph and created edge.
side_effects:
  reads:
    - graph JSON files requested by open
    - JSON parameter packets referenced with @path
  writes:
    - graph JSON files requested by save
validation:
  - graph_id is a non-empty string
  - node and edge identities are separate graph-local positive integers
  - edge endpoints refer to existing nodes
  - counters are monotonic and identities are assigned by the tool
  - python3 -m unittest discover -s file-tools/semantic_graph/tests
