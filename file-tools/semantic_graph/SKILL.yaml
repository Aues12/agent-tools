name: semantic_graph
type: tool
capability: semantic_graph_construction
purpose: Build and validate small LLM-authored directed semantic graphs.
status: experimental
interfaces:
  - name: stdin_json
    entrypoint: semantic_graph.py
    transport: stdin_json
  - name: python_api
    entrypoint: tool.py
    callables:
      - build_graph
      - validate_graph
      - run
operations:
  - name: build_graph
    available_via:
      - stdin_json
      - python_api
    params:
      nodes:
        type: array
        required: true
      edges:
        type: array
        required: false
        default: []
      name:
        type: string
        required: false
      description:
        type: string
        required: false
      attributes:
        type: object
        required: false
      require_acyclic:
        type: boolean
        required: false
        default: false
    returns:
      type: object
      description: Normalized directed semantic graph.
  - name: validate_graph
    available_via:
      - stdin_json
      - python_api
    params:
      graph:
        type: object
        required: true
      require_acyclic:
        type: boolean
        required: false
        default: false
    returns:
      type: object
      description: Validated and normalized directed semantic graph.
side_effects:
  reads: []
  writes: []
validation:
  - node ids are unique non-empty strings
  - edge endpoints refer to existing nodes
  - duplicate edges are rejected
  - kinds remain caller-defined strings
  - cycles are rejected only when require_acyclic is true
  - python3 -m unittest discover -s file-tools/semantic_graph/tests
